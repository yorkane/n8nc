name: 'Sync Upstream & Build Docker Image'

env:
  NODE_OPTIONS: '--max-old-space-size=8192'
  IMAGE_NAME: ghcr.io/yorkane/n8nc

on:
  schedule:
    - cron: '0 4 * * *' # Daily at UTC 04:00 (Beijing 12:00)
  workflow_dispatch:
    inputs:
      skip_merge:
        description: 'Skip upstream merge (build only)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [chs]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  sync-upstream:
    name: Sync from upstream/chs
    runs-on: ubuntu-latest
    # Only run merge on schedule or manual trigger (not on push)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_merge != 'true')
    outputs:
      has_changes: ${{ steps.merge.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: chs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/deluxebear/n8n.git || true
          git fetch upstream chs

      - name: Merge upstream/chs
        id: merge
        run: |
          # Check if there are new commits
          BEHIND=$(git rev-list --count HEAD..upstream/chs)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream/chs"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $BEHIND new commits from upstream/chs"
          echo "has_changes=true" >> $GITHUB_OUTPUT

          # Attempt merge with --theirs strategy
          MERGE_MSG="chore: auto-merge upstream/chs ($(date -u +%Y-%m-%d))"
          if git merge upstream/chs -X theirs --no-edit -m "$MERGE_MSG"; then
            echo "Merge completed cleanly"
            exit 0
          fi

          echo "::warning::Merge had conflicts, attempting auto-resolution..."

          # --- Auto-resolve conflicts ---

          # 1. Handle rename/delete: we renamed .yml -> .yml.disabled, upstream deleted .yml
          #    Resolution: accept the deletion (remove our .disabled copy)
          for f in $(git diff --name-only --diff-filter=U); do
            if [[ "$f" == *.yml.disabled ]]; then
              echo "Removing renamed-then-deleted: $f"
              git rm -f "$f" 2>/dev/null || true
            fi
          done

          # 2. Handle modify/delete: file deleted in HEAD but modified in upstream
          #    Resolution: accept upstream's version (keep the file)
          #    Also handle: file modified in HEAD but deleted in upstream -> accept deletion
          for f in $(git diff --name-only --diff-filter=U); do
            if git ls-tree upstream/chs -- "$f" > /dev/null 2>&1; then
              echo "Accepting upstream version: $f"
              git checkout upstream/chs -- "$f"
              git add "$f"
            else
              echo "Accepting deletion: $f"
              git rm -f "$f" 2>/dev/null || true
            fi
          done

          # 3. Handle any remaining conflicts with --theirs
          REMAINING=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$REMAINING" ]; then
            echo "Resolving remaining conflicts with --theirs:"
            echo "$REMAINING"
            echo "$REMAINING" | while read -r f; do
              git checkout --theirs "$f" 2>/dev/null && git add "$f" || git rm -f "$f" 2>/dev/null || true
            done
          fi

          # 4. Remove any .github/workflows/*.yml files that upstream brings in
          #    (we keep them disabled as .yml.disabled, don't want them active)
          #    But preserve our own sync-build-push.yml
          for f in .github/workflows/*.yml; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "sync-build-push.yml" ]; then
              echo "Disabling upstream workflow: $f -> ${f}.disabled"
              git mv "$f" "${f}.disabled" 2>/dev/null || mv "$f" "${f}.disabled"
              git add "${f}.disabled"
              git rm -f "$f" 2>/dev/null || true
            fi
          done

          git commit --no-edit -m "$MERGE_MSG" || true
          echo "Merge conflicts auto-resolved"

      - name: Push merged code
        if: steps.merge.outputs.has_changes == 'true'
        run: git push origin chs

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [sync-upstream]
    # Run if:
    # 1. sync-upstream succeeded (schedule/manual with merge)
    # 2. push event (sync-upstream is skipped)
    # 3. manual with skip_merge (sync-upstream is skipped)
    if: |
      always() && (
        needs.sync-upstream.result == 'success' ||
        needs.sync-upstream.result == 'skipped'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: chs
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build n8n
        run: |
          pnpm build > build.log 2>&1
          tail -n 20 build.log

      - name: Build n8n for Docker
        run: pnpm build:n8n

      - name: Determine Docker tags
        id: tags
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)

          TAGS="${IMAGE_NAME}:latest"
          TAGS="${TAGS},${IMAGE_NAME}:chs"
          TAGS="${TAGS},${IMAGE_NAME}:${DATE_TAG}"
          TAGS="${TAGS},${IMAGE_NAME}:${DATE_TAG}-${SHORT_SHA}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile.slim
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=n8nc
            org.opencontainers.image.description=n8n Chinese Edition - Workflow Automation
            org.opencontainers.image.source=https://github.com/yorkane/n8nc
            org.opencontainers.image.version=${{ github.sha }}

      - name: Summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`chs\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$(date -u +%Y%m%d)\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
